name: Generate snake game and activity graph

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kalhara84
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          username: Kalhara84
          options: theme=tokyo-night&hide_border=true&area=true&custom_title=Kalhara%27s%20Contribution%20Graph&area_color=0e75b6&line=0e75b6&point=ffffff
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}